<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vũ trụ tình yêu 💖</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #000010 40%, #000000 100%);
      position: relative;
      font-family: 'Poppins', sans-serif;
    }

    /* Dòng chữ phía trên */
    .message {
      position: absolute;
      top: 8%;
      width: 100%;
      text-align: center;
      font-size: 1.3em;
      color: #ff7ea8;
      font-weight: bold;
      text-shadow: 0 0 10px #ff4d79;
      animation: moveText 10s linear infinite;
      white-space: nowrap;
    }

    @keyframes moveText {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    /* Hiệu ứng trái tim 3D */
    .heart {
      position: relative;
      width: 150px;
      height: 135px;
      transform: rotate(-45deg);
      animation: beat 1.3s infinite ease-in-out;
    }

    .heart:before,
    .heart:after {
      content: "";
      position: absolute;
      width: 150px;
      height: 135px;
      background: red;
      border-radius: 50%;
    }

    .heart:before {
      top: -75px;
      left: 0;
    }

    .heart:after {
      left: 75px;
      top: 0;
    }

    @keyframes beat {
      0%, 100% { transform: rotate(-45deg) scale(1); }
      50% { transform: rotate(-45deg) scale(1.2); }
    }

    /* Nhiều trái tim nhỏ bay quanh */
    .mini-heart {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #ff4d79;
      transform: rotate(45deg);
      animation: float 5s linear infinite;
      opacity: 0.8;
    }

    .mini-heart:before,
    .mini-heart:after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      background: #ff4d79;
      border-radius: 50%;
    }

    .mini-heart:before { top: -6px; left: 0; }
    .mini-heart:after { left: 6px; top: 0; }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(45deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-800px) rotate(45deg);
        opacity: 0;
      }
    }

    /* Responsive cho điện thoại */
    @media (max-width: 600px) {
      .heart {
        width: 100px;
        height: 90px;
      }
      .heart:before, .heart:after {
        width: 100px;
        height: 90px;
      }
      .heart:after { left: 50px; }
      .message { font-size: 1em; top: 10%; }
    }
  </style>
</head>
<body>
  <div class="message">💞 Ngày mai vợ qua nhà anh chơi nha hjhj 💞</div>
  <div class="heart"></div>

  <script>
    // Tạo ngẫu nhiên nhiều trái tim nhỏ bay quanh
    const numHearts = 25;
    for (let i = 0; i < numHearts; i++) {
      const mini = document.createElement('div');
      mini.classList.add('mini-heart');
      document.body.appendChild(mini);
      mini.style.left = Math.random() * window.innerWidth + 'px';
      mini.style.bottom = Math.random() * window.innerHeight / 2 + 'px';
      mini.style.animationDuration = (3 + Math.random() * 3) + 's';
      mini.style.animationDelay = Math.random() * 3 + 's';
      mini.style.opacity = 0.6 + Math.random() * 0.4;
    }
  </script>
</body>
</html>
