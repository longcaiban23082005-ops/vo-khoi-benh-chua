<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vợ còn giận anh không?</title>
  <style>
    :root{
      --bg1:#FFE8F3;
      --bg2:#FFF6E8;
      --accent:#FF6B9A;
      --accent-2:#FFB86B;
      --text:#3b2b3b;
      --card:#FFFFFFCC;
    }
    html,body{height:100%;margin:0;font-family:"Inter",sans-serif}
    body{
      background: linear-gradient(160deg,var(--bg1),var(--bg2));
      display:flex;align-items:center;justify-content:center;padding:24px;
    }
    .card{
      width:min(720px,96vw);
      background:var(--card);
      border-radius:20px;box-shadow:0 10px 30px rgba(59,43,59,0.12);
      padding:28px 28px 40px;position:relative;overflow:hidden;text-align:center;
    }
    h1{
      margin:6px 0;font-size:38px;line-height:1.2;color:var(--text);
      letter-spacing:0.6px;font-weight:800;text-shadow:0 2px 0 rgba(255,255,255,0.6);
    }
    p.lead{margin:0 0 18px;color:#6b4f5f;font-size:16px}
    .heart{
      width:110px;height:110px;margin:18px auto;position:relative;
      animation:pop 1.2s infinite cubic-bezier(.2,.9,.3,1);
    }
    .heart:before,.heart:after{
      content:'';position:absolute;left:55px;top:0;width:55px;height:90px;
      background:linear-gradient(180deg,var(--accent),#FF85A8);
      border-radius:55px 55px 0 0;transform:rotate(-45deg);
      transform-origin:0 100%;box-shadow:0 6px 18px rgba(255,107,154,0.25);
    }
    .heart:after{left:0;transform:rotate(45deg);background:linear-gradient(180deg,var(--accent-2),#FFC28A)}
    @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

    .btn-row{display:flex;gap:10px;justify-content:center;margin-top:16px;position:relative;height:50px}
    button{
      background:linear-gradient(90deg,var(--accent),var(--accent-2));
      border:0;color:white;padding:10px 18px;border-radius:12px;
      font-weight:700;cursor:pointer;box-shadow:0 6px 14px rgba(255,107,154,0.18);
      transition:all .2s ease;
    }
    .muted{background:#fff;border:1px dashed rgba(59,43,59,0.06);color:#5b4350;position:absolute;}

    .footer{font-size:12px;color:#7a5966;margin-top:12px}
    canvas.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  </style>
</head>
<body>
  <div class="card">
    <div class="heart"></div>
    <h1>Vợ còn giận anh không?</h1>
    <p class="lead">Thử nhấn xem... ai hết giận trước nha 💞</p>
    <div class="btn-row">
      <button id="btnYes">Hết giận rồi 💖</button>
      <button id="btnNo" class="muted" style="left:180px;">Còn giận 😤</button>
    </div>
    <p class="footer">Trang này an toàn, đáng yêu và chỉ dành cho Vợ 💕</p>
    <canvas class="confetti" id="confettiCanvas"></canvas>
  </div>

  <script>
    const canvas=document.getElementById('confettiCanvas');
    const ctx=canvas.getContext('2d');
    let W,H;function resize(){W=canvas.width=canvas.clientWidth;H=canvas.height=canvas.clientHeight;}
    window.addEventListener('resize',resize);resize();

    // Pháo hoa + tim bay khi "Hết giận rồi 💖"
    function random(min,max){return Math.random()*(max-min)+min}
    let confs=[];
    function spawn(n){for(let i=0;i<n;i++){confs.push({
      x:random(0,W),y:H,color:['#FF6B9A','#FFC28A','#FFD6F0','#9EE7FF','#C6FFDD'][Math.floor(random(0,5))],
      size:random(6,14),speedY:random(2,6),drift:random(-1,1)
    })}}
    function draw(){
      ctx.clearRect(0,0,W,H);
      for(let i=confs.length-1;i>=0;i--){
        let c=confs[i];ctx.fillStyle=c.color;
        ctx.beginPath();ctx.arc(c.x,c.y,c.size,0,Math.PI*2);ctx.fill();
        c.y-=c.speedY;c.x+=c.drift;if(c.y<-20)confs.splice(i,1);
      }
      requestAnimationFrame(draw);
    }draw();

    document.getElementById('btnYes').addEventListener('click',()=>{
      spawn(100);
      const h1=document.querySelector('h1');
      h1.textContent='Yêu vợ nhất đó 💕';
      setTimeout(()=>{h1.textContent='Vợ còn giận anh không?';},4000);
    });

    // Nút "Còn giận 😤" sẽ né tránh
    const btnNo=document.getElementById('btnNo');
    btnNo.addEventListener('mouseenter',()=>{
      const row=btnNo.parentElement;
      const maxX=row.clientWidth-110;
      const maxY=20;
      const x=Math.random()*maxX;
      const y=Math.random()*maxY;
      btnNo.style.left=x+'px';
      btnNo.style.top=y+'px';
    });
  </script>
</body>
</html>
