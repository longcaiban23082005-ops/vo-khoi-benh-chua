<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vợ còn giận chồng thúi hong?</title>
  <style>
    :root {
      --bg1: #ffe6f2;
      --bg2: #ffd9ec;
      --accent: #ff7aa8;
      --accent2: #ffc1d6;
      --text: #4a2c5b;
      --card: #fff9fc;
    }
    html, body {
      height: 100%;
      margin: 0;
      font-family: "Poppins", sans-serif;
    }
    body {
      background: linear-gradient(160deg, var(--bg1), var(--bg2));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: min(420px, 96vw);
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(255, 122, 168, 0.25);
      padding: 28px 20px 36px;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: opacity 0.6s ease;
    }
    h1 {
      font-size: 28px;
      color: var(--text);
      font-weight: 700;
      margin-bottom: 10px;
    }
    p.lead {
      color: #6b4f5f;
      font-size: 15px;
      margin-bottom: 20px;
    }
    .heart {
      width: 90px;
      height: 90px;
      margin: 0 auto 12px;
      position: relative;
      animation: pop 1.5s infinite ease-in-out;
    }
    .heart:before, .heart:after {
      content: "";
      position: absolute;
      width: 45px;
      height: 72px;
      background: linear-gradient(180deg, var(--accent), #ff94b8);
      border-radius: 45px 45px 0 0;
      top: 0;
      left: 45px;
      transform: rotate(-45deg);
      transform-origin: 0 100%;
    }
    .heart:after {
      left: 0;
      transform: rotate(45deg);
      transform-origin: 100% 100%;
      background: linear-gradient(180deg, var(--accent2), #ffd0e2);
    }
    @keyframes pop {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      position: relative;
      min-height: 60px;
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.3s ease;
    }
    #btnYes {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: white;
      box-shadow: 0 6px 14px rgba(255, 107, 154, 0.18);
    }
    #btnNo {
      background: #fff;
      border: 1px dashed #d8b8c5;
      color: #5b4350;
      position: relative;
    }
    canvas.confetti {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .footer {
      font-size: 12px;
      color: #7a5966;
      margin-top: 14px;
    }

    /* Màn hình 2 */
    .screen2 {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      background: linear-gradient(135deg, #ffd6f0, #ffeef7);
      animation: fadeIn 0.8s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .gif {
      width: 200px;
      max-width: 80%;
      border-radius: 16px;
      margin-top: 20px;
      box-shadow: 0 4px 12px rgba(255, 120, 160, 0.25);
    }

    @media (max-width: 420px) {
      h1 { font-size: 24px; }
      .heart { width: 70px; height: 70px; }
      .btn-row { gap: 10px; }
      button { padding: 9px 14px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="card" id="mainScreen">
    <div class="heart"></div>
    <h1>Vợ còn giận chồng thúi honggg?</h1>
    <p class="lead">Nếu hết giận rồi thì ngày mai qua chồng chơi nhen bà xã ơiiiii 💖</p>
    <div class="btn-row">
      <button id="btnYes">Hết giận rồi 💕</button>
      <button id="btnNo">Còn giận xíu xíu 😤</button>
    </div>
    <p class="footer">Trang đáng yêu này tự chạy trốn khỏi cơn giận của vợ đó nhaaa 😆</p>
    <canvas class="confetti" id="confettiCanvas"></canvas>
  </div>

  <!-- Màn hình 2 -->
  <div class="screen2" id="screen2">
    <h1>Vậy thì mai sang nhà anh chơi nha hahaha 😝💞</h1>
    <img class="gif" src="https://media.tenor.com/GfRKqU6dGJMAAAAi/bubu-dudu-cute.gif" alt="cute gif">
  </div>

  <script>
    const btnYes = document.getElementById('btnYes');
    const btnNo = document.getElementById('btnNo');
    const card = document.getElementById('mainScreen');
    const screen2 = document.getElementById('screen2');
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width = card.clientWidth;
      H = canvas.height = card.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function random(min, max) { return Math.random() * (max - min) + min; }
    function Confetti() {
      this.x = random(0, W);
      this.y = random(-H, 0);
      this.size = random(6, 12);
      this.speed = random(1, 3);
      this.color = ['#FF6B9A', '#FFC28A', '#FFD6F0', '#9EE7FF', '#C6FFDD'][Math.floor(random(0, 5))];
    }
    let confs = [];
    function spawn(n) { for (let i = 0; i < n; i++) confs.push(new Confetti()); }
    function draw() {
      ctx.clearRect(0, 0, W, H);
      for (let i = confs.length - 1; i >= 0; i--) {
        let c = confs[i];
        c.y += c.speed; c.x += Math.sin(c.y / 10);
        ctx.fillStyle = c.color; ctx.fillRect(c.x, c.y, c.size, c.size);
        if (c.y > H + 50) confs.splice(i, 1);
      }
      requestAnimationFrame(draw);
    }
    draw();

    btnYes.addEventListener('click', () => {
      spawn(100);
      card.style.opacity = 0;
      setTimeout(() => {
        card.style.display = "none";
        screen2.style.display = "flex";
      }, 600);
    });

    function moveButton() {
      const parent = btnNo.parentElement;
      const rect = parent.getBoundingClientRect();
      const newX = random(0, rect.width - 100);
      const newY = random(0, rect.height - 50);
      btnNo.style.transform = `translate(${newX}px,${newY}px)`;
    }

    btnNo.addEventListener('mouseenter', moveButton);
    btnNo.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveButton();
    });
  </script>
</body>
</html>
