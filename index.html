<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hết giận rồi nha 💕</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffe6f0, #ffc2d1);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      overflow: hidden;
      transition: background 1s ease;
    }

    .container {
      text-align: center;
      transition: transform 0.6s ease, opacity 0.6s ease;
      padding: 20px;
    }

    h1 {
      color: #ff4d79;
      font-size: 2em;
      margin-bottom: 30px;
    }

    button {
      background-color: #ff80a6;
      border: none;
      border-radius: 25px;
      padding: 15px 30px;
      margin: 10px;
      font-size: 1.1em;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 128, 166, 0.3);
      transition: all 0.3s ease;
    }

    button:hover {
      transform: scale(1.08);
      background-color: #ff99bb;
    }

    .moving {
      position: absolute;
    }

    .result {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: fadeIn 1s ease forwards;
    }

    .result h2 {
      color: #fff;
      font-size: 1.8em;
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.2);
      padding: 10px 20px;
      border-radius: 20px;
    }

    .gif {
      width: 220px;
      height: auto;
      margin-top: 20px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.6em; }
      button { padding: 12px 25px; font-size: 1em; }
      .gif { width: 180px; }
    }
  </style>
</head>
<body>
  <div class="container" id="main">
    <h1>Em còn giận anh không? 🥺</h1>
    <button id="noBtn">Còn giận 😤</button>
    <button id="yesBtn">Hết giận rồi 💕</button>
  </div>

  <div class="result" id="result">
    <h2>Vậy thì mai sang nhà anh chơi nha hahaha 😍💖</h2>
    <img class="gif" id="gif" src="" alt="cute meme">
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const main = document.getElementById('main');
    const result = document.getElementById('result');
    const gif = document.getElementById('gif');

    const gifs = [
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExeGI1dnRzYWxjb3h1b3E3cmplMGxtN3pmcnV3Z2ozcWg3Y2E4eHFjdCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/3ohs4BSacFKI7A717y/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdWk5cGZsYXNnMW42dzVjbGltY2o3amplb2VtdGpmNmhyOWEwOXltMCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/xT0BKqhdlKCxCNsVTq/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZ3g3ZXA2bnY0azE5bDk3Z2Z4OGxhd2Vxam9nYTh0bDh4NXlwd2luMiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/10tIjpzIu8fe0/giphy.gif"
    ];

    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() * (window.innerWidth - noBtn.clientWidth);
      const y = Math.random() * (window.innerHeight - noBtn.clientHeight);
      noBtn.style.position = "absolute";
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    });

    yesBtn.addEventListener('click', () => {
      document.body.style.background = "linear-gradient(135deg, #ff9ec4, #ff6fa9)";
      main.style.opacity = 0;
      setTimeout(() => {
        main.style.display = "none";
        result.style.display = "flex";
        const randomGif = gifs[Math.floor(Math.random() * gifs.length)];
        gif.src = randomGif;
      }, 600);
    });
  </script>
</body>
</html>
